<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souly Arena</title>
<style>
  :root{
    --radius-lg: 22px;
    --radius-md: 14px;
    --ease: cubic-bezier(.22,1,.36,1);
    --accent: #6ee7ff;
    --accent2: #a78bfa;
    --gold: #fbbf24;
    --danger: #fb7185;
    --good: #34d399;
  }
  html[data-theme="dark"]{
    --bg1:#050510; --bg2:#0d0a24; --bg3:#0a2e42; --bg4:#020208;
    --glass-bg: rgba(124,92,255,0.10);
    --glass-bg-strong: rgba(139,110,255,0.20);
    --glass-border: rgba(167,139,250,0.28);
    --text: #f4f6ff;
    --text-dim: rgba(244,246,255,0.62);
    --shadow: 0 10px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
    --input-bg: rgba(255,255,255,0.06);
    --blob-opacity: .55;
  }
  html[data-theme="light"]{
    --bg1:#f3f5ff; --bg2:#eaf1ff; --bg3:#eef9ff; --bg4:#f7f6ff;
    --glass-bg: rgba(255,255,255,0.70);
    --glass-bg-strong: rgba(255,255,255,0.88);
    --glass-border: rgba(99,102,241,0.14);
    --text: #0f172a;
    --text-dim: rgba(15,23,42,0.55);
    --shadow: 0 8px 26px rgba(99,102,241,0.10), inset 0 1px 0 rgba(255,255,255,0.7);
    --input-bg: rgba(15,23,42,0.04);
    --blob-opacity: .22;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
    background: linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 35%,var(--bg3) 70%,var(--bg4) 100%);
    background-size:200% 200%;
    animation: bgshift 22s ease infinite;
    position:relative;
    transition: color .35s var(--ease);
  }
  @keyframes bgshift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  .blob{
    position:fixed; border-radius:50%; filter:blur(70px); opacity:var(--blob-opacity); z-index:0;
    animation: float 18s ease-in-out infinite;
    transition: opacity .35s var(--ease);
  }
  .blob1{width:360px;height:360px; background:var(--accent2); top:-90px; left:-90px;}
  .blob2{width:320px;height:320px; background:var(--accent); bottom:-70px; right:-70px; animation-delay:-6s;}
  .blob3{width:280px;height:280px; background:#f472b6; top:38%; left:58%; animation-delay:-12s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(34px,-34px) scale(1.1);}
  }
  .app{position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);} }

  .glass{
    background:var(--glass-bg);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    transition: background .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease), transform .18s var(--ease);
  }
  .glass-strong{ background:var(--glass-bg-strong); }
  .screen{ padding:20px 16px 90px; flex:1; animation: fadeIn .35s var(--ease); }
  h1,h2,h3{margin:0 0 8px; letter-spacing:-0.01em;}
  p{margin:0 0 8px; color:var(--text-dim); font-size:14px; line-height:1.5;}
  .center{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .logo{ display:flex; justify-content:center; margin-bottom:6px; color:var(--accent); animation: popIn .5s var(--ease); }
  .brand{ text-align:center; font-size:25px; font-weight:800; letter-spacing:0.5px; margin-bottom:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .tagline{text-align:center; margin-bottom:22px;}
  input{
    width:100%; padding:13px 14px; margin-bottom:12px; border-radius:var(--radius-md);
    border:1px solid var(--glass-border); background:var(--input-bg); color:var(--text);
    font-size:15px; outline:none; transition:border-color .2s var(--ease), background .3s var(--ease), box-shadow .2s var(--ease);
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(110,231,255,0.18); }
  input::placeholder{color:var(--text-dim);}
  select{
    width:100%; padding:13px 14px; margin-bottom:12px; border-radius:var(--radius-md);
    border:1px solid var(--glass-border); background:var(--input-bg); color:var(--text);
    font-size:14px; outline:none;
  }
  button{
    cursor:pointer; border:none; border-radius:var(--radius-md); font-weight:700; font-size:15px;
    padding:13px 16px; color:#0f172a; transition:transform .15s var(--ease), opacity .12s ease, box-shadow .2s var(--ease), filter .2s ease;
  }
  button:active{transform:scale(0.95);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{ width:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 6px 20px rgba(110,231,255,0.25); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ width:100%; background:transparent; color:var(--text); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-small{ padding:8px 14px; font-size:13px; }
  .pwd-wrap{ position:relative; }
  .pwd-wrap input{ padding-right:44px; }
  .pwd-toggle{ position:absolute; right:4px; top:50%; transform:translateY(-50%); background:transparent; color:var(--text-dim); padding:8px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
  .pwd-toggle:hover{ color:var(--text); }
  .pwd-toggle:active{ transform:translateY(-50%) scale(0.9); }
  .devbtn{ display:flex; align-items:center; gap:6px; background:var(--good); color:#0f172a; padding:7px 14px; border-radius:999px; font-weight:700; font-size:13px; text-decoration:none; border:none; box-shadow:0 4px 14px rgba(52,211,153,0.3); }
  .devbtn:hover{ filter:brightness(1.06); }
  .devbtn:active{ transform:scale(0.95); }
  .link{ text-align:center; margin-top:10px; color:var(--accent); font-size:14px; cursor:pointer; font-weight:600; }
  .err{ color:var(--danger); font-size:13px; margin:-4px 0 10px; min-height:16px; animation: fadeIn .2s ease; }
  .msg{ color:var(--good); font-size:13px; margin:-4px 0 10px; min-height:16px; }

  .topbar{ position:sticky; top:0; z-index:5; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; animation: fadeInUp .4s var(--ease); }
  .avatar{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--glass-bg-strong); box-shadow:0 2px 8px rgba(0,0,0,0.15); flex-shrink:0; }
  .avatar svg{ display:block; }
  .hstat{ display:flex; gap:8px; align-items:center; font-size:13px; font-weight:700;}
  .pill{ display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:999px; transition: transform .2s var(--ease); color:var(--text); }
  .pill.bump{ animation: bump .35s var(--ease); }
  @keyframes bump{ 0%{transform:scale(1);} 40%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .theme-toggle{ width:34px; height:34px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center; background:var(--glass-bg-strong); color:var(--text); border:1px solid var(--glass-border); }

  .card{ padding:16px; margin-bottom:14px; animation: fadeInUp .4s var(--ease); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .menu-card{ padding:22px 14px; text-align:center; cursor:pointer; animation: fadeInUp .45s var(--ease) backwards; border-color:var(--card-accent, var(--glass-border)) !important; }
  .menu-card:nth-child(1){ animation-delay:.02s; }
  .menu-card:nth-child(2){ animation-delay:.08s; }
  .menu-card:nth-child(3){ animation-delay:.14s; }
  .menu-card:nth-child(4){ animation-delay:.2s; }
  .menu-card:active{ transform:scale(0.96); }
  .menu-card .ico{ display:flex; justify-content:center; margin-bottom:8px; color:var(--card-accent, var(--accent)); filter:drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }
  .menu-card .lvl{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  .menu-card.mc-ttt{ --card-accent:#818cf8; }
  .menu-card.mc-quiz{ --card-accent:#e879f9; }
  .menu-card.mc-ai{ --card-accent:#38bdf8; }
  .menu-card.mc-shop{ --card-accent:#fbbf24; }

  .xpbar-track{ height:10px; border-radius:999px; background:var(--input-bg); overflow:hidden; margin:6px 0 4px; position:relative; }
  .xpbar-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px; transition: width .6s var(--ease); position:relative; overflow:hidden; }
  .xpbar-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    width:40%; animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer{ 0%{transform:translateX(-120%);} 100%{transform:translateX(320%);} }

  .bottomnav{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:min(440px,92%);
    display:grid; grid-template-columns:repeat(6,1fr); padding:8px 6px; z-index:10;
    animation: fadeInUp .4s var(--ease);
    border-radius:var(--radius-lg);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
  }
  .nav-pill{ position:absolute; top:6px; bottom:6px; left:0; border-radius:14px; background:var(--glass-bg-strong); box-shadow:0 4px 14px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.12); z-index:0; transition: transform .45s var(--ease), width .45s var(--ease); pointer-events:none; }
  .navbtn{ position:relative; z-index:1; background:none; border:none; color:var(--text-dim); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border-radius:12px; transition: color .2s var(--ease), transform .15s var(--ease); }
  .navbtn.active{ color:var(--text); transform:translateY(-2px); }
  .navbtn .ni{ display:flex; transition: transform .2s var(--ease); }
  .navbtn.active .ni{ transform:scale(1.12); }

  /* Pill selector meluncur (dipakai untuk mode tantangan) */
  .pillbar{ position:relative; display:grid; background:var(--input-bg); border-radius:999px; padding:4px; margin:10px 0 4px; }
  .pillbar-pill{ position:absolute; top:4px; bottom:4px; left:0; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); z-index:0; box-shadow:0 4px 14px rgba(110,231,255,.25); transition: transform .4s var(--ease), width .4s var(--ease); }
  .pillbar-btn{ position:relative; z-index:1; background:none; border:none; padding:9px 4px; font-size:12px; font-weight:700; color:var(--text-dim); border-radius:999px; transition:color .25s var(--ease); }
  .pillbar-btn.active{ color:#0f172a; }

  .board{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  .cell{ aspect-ratio:1; border-radius:var(--radius-md); background:var(--input-bg); border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; cursor:pointer;
    transition: background .2s var(--ease), transform .15s var(--ease); }
  .cell:hover{ background:var(--glass-bg-strong); }
  .cell.x, .cell.o{ animation: popIn .25s var(--ease); }
  .cell.x{ color:var(--accent); }
  .cell.o{ color:#f472b6; }
  .cell:active{ transform:scale(0.93); }

  .qopt{ width:100%; text-align:left; margin-bottom:10px; background:var(--input-bg); color:var(--text); border:1px solid var(--glass-border); animation: fadeInUp .3s var(--ease) backwards; }
  .qopt:nth-child(1){animation-delay:0s;} .qopt:nth-child(2){animation-delay:.05s;} .qopt:nth-child(3){animation-delay:.1s;} .qopt:nth-child(4){animation-delay:.15s;}
  .qopt.correct{ background:rgba(52,211,153,0.3); border-color:var(--good); animation:popIn .3s var(--ease); }
  .qopt.wrong{ background:rgba(251,113,133,0.3); border-color:var(--danger); animation:shake .35s var(--ease); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .chatlog{ height:46vh; overflow-y:auto; padding:6px 2px; display:flex; flex-direction:column; gap:8px; }
  .bubble{ padding:10px 13px; border-radius:16px; max-width:82%; font-size:14px; line-height:1.4; animation: fadeInUp .25s var(--ease); }
  .bubble.me{ align-self:flex-end; background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0f172a; font-weight:600;}
  .bubble.ai{ align-self:flex-start; background:var(--input-bg); border:1px solid var(--glass-border); }
  .bubble .katex-display{ overflow-x:auto; overflow-y:hidden; margin:6px 0; }
  .bubble .katex{ font-size:1em; }
  .bubble ul{ margin:4px 0; padding-left:20px; }
  .bubble li{ margin:2px 0; }
  .chatrow{ display:flex; gap:8px; margin-top:10px; }
  .chatrow input{ margin:0; flex:1; }

  .shopitem{ display:flex; align-items:center; justify-content:space-between; padding:14px; margin-bottom:10px; animation: fadeInUp .4s var(--ease); transition: transform .18s var(--ease); }
  .shopitem:hover{ transform:translateY(-2px); }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-14px); z-index:50; padding:11px 20px;
    border-radius:14px; font-size:13px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .3s var(--ease), transform .3s var(--ease); box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(10px); }
  .hidden{ display:none !important; }
  .small{ font-size:12px; color:var(--text-dim); }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .swatch-pick{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
  .swatch{ width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition: transform .15s var(--ease), border-color .15s var(--ease); }
  .swatch:hover{ transform:scale(1.1); }
  .swatch.sel{ border-color:var(--text); transform:scale(1.15); }
  .spinner{ width:16px;height:16px;border-radius:50%;border:2px solid rgba(120,120,120,0.3); border-top-color:currentColor; animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .devcard p{ margin-bottom:6px; }
  .keyhint{ color:var(--gold); }
  .admincard{ border-color:rgba(251,191,36,0.35) !important; }
  .admincard h3{ color:var(--gold); }
  .gift-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .gift-grid label{ font-size:11px; color:var(--text-dim); display:block; margin-bottom:4px; }
  .gift-grid input{ margin-bottom:0; padding:10px; font-size:14px; text-align:center; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div>
<div id="toast" class="toast glass-strong"></div>
<div class="app" id="app"></div>

<script>
/* ===================== IKON (SVG, tanpa emoji) ===================== */
const ICONS = {
  home:  '<path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5Z"/>',
  ttt:   '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  quiz:  '<circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.7 2.7 0 1 1 3.8 2.5c-1 .4-1.6 1.1-1.6 2.3"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>',
  ai:    '<path d="M4 5h16v11H9l-4 4V5Z"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="13" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="17" cy="10" r="1" fill="currentColor" stroke="none"/>',
  shop:  '<path d="M6 8V6a6 6 0 0 1 12 0v2"/><rect x="3" y="8" width="18" height="13" rx="2"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:  '<path d="M20 14.6A8.5 8.5 0 1 1 9.4 4a7 7 0 0 0 10.6 10.6Z"/>',
  coin:  '<circle cx="12" cy="12" r="9"/><path d="M9 15.4c.5.8 1.5 1.2 3 1.2s2.6-.6 2.6-1.6-1-1.4-2.6-1.7-2.6-.7-2.6-1.7S10.5 10 12 10s2.5.4 3 1.2M12 8.2v1.5M12 14.3v1.5"/>',
  bulb:  '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1.2.9 2.1h5.2c0-.9.3-1.6.9-2.1A6 6 0 0 0 12 3Z"/>',
  gem:   '<path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M2 9h20M9 3l3 6 3-6M9 9l3 12 3-12"/>',
  send:  '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>',
  key:   '<circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M16.5 6.5l3 3M13.5 9.5l2 2"/>',
  dev:   '<path d="M8 9 4 12l4 3M16 9l4 3-4 3M13.5 6 10.5 18"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  camera:'<path d="M4 8h3l1.6-2h6.8L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.4"/>',
  eye:   '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.4 4.4M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.6-.2 3.7-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  whatsapp:'<path d="M3 21l1.4-4.9A8.5 8.5 0 1 1 8 19.6L3 21Z"/><path d="M8.5 8.3c.2-.5.5-.5.8-.5h.6c.2 0 .5 0 .7.5.3.6.9 2 .9 2.1.1.2.1.4 0 .6-.1.2-.2.3-.4.5l-.5.6c-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.6-.7c.2-.3.4-.2.7-.1l1.9.9c.2.1.4.2.5.3.1.2.1.9-.2 1.4-.3.6-1.6 1.2-2.2 1.2-.6.1-1.3.1-4.2-1.1-3.5-1.5-5.7-5-5.9-5.3-.2-.3-1.4-1.9-1.4-3.6 0-1.7.9-2.5 1.2-2.9Z" fill="currentColor" stroke="none"/>',
};
function icon(name, size){
  size = size || 20;
  return '<svg class="ico-svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';
}

/* ===================== TEMA (dark / light) ===================== */
let THEME = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
}
function toggleTheme(){
  THEME = THEME === 'dark' ? 'light' : 'dark';
  applyTheme();
  document.querySelectorAll('.theme-toggle').forEach(b=> b.innerHTML = icon(THEME==='dark'?'sun':'moon',16));
}
applyTheme();

/* ===================== STORAGE / DATA LAYER =====================
   Rantai penyimpanan: window.storage (tersedia saat dijalankan di
   dalam Claude, dapat dipakai bersama) -> localStorage (dipakai saat
   di-deploy mandiri, misalnya di Render, per-browser) -> memori
   sementara (cadangan terakhir kalau semuanya gagal / diblokir).
   Ini membuat aplikasi tetap berjalan normal baik di preview Claude
   maupun setelah di-deploy sebagai situs statis biasa. */
const memoryStore = {};
let storageOK = true;
function lsAvailable(){
  try{ const k='__souly_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const LS_OK = lsAvailable();
const LS_PREFIX = 'soulyarena:';

async function storeGet(key, shared){
  if(typeof window.storage !== 'undefined'){
    try{
      const r = await window.storage.get(key, shared);
      if(r && typeof r.value === 'string') return r.value;
      return null;
    }catch(e){
      const msg = (e && e.message) || '';
      if(/not found|does not exist|no such/i.test(msg)) return null;
      console.warn('[storage] window.storage gagal, coba sumber lain:', e);
    }
  }
  if(LS_OK){
    const raw = localStorage.getItem(LS_PREFIX+key);
    if(raw !== null) return raw;
  }
  return Object.prototype.hasOwnProperty.call(memoryStore,key) ? memoryStore[key] : null;
}
async function storeSet(key, value, shared){
  memoryStore[key] = value;
  let persisted = false;
  if(typeof window.storage !== 'undefined'){
    try{ const r = await window.storage.set(key, value, shared); if(r) persisted = true; }
    catch(e){ console.warn('[storage] window.storage set gagal:', e); }
  }
  if(LS_OK){
    try{ localStorage.setItem(LS_PREFIX+key, value); persisted = true; }
    catch(e){ console.warn('[storage] localStorage set gagal:', e); }
  }
  storageOK = persisted;
  return true;
}

/* ===================== IDENTITAS PERANGKAT & APPROVAL LOGIN =====================
   Setiap perangkat/browser menyimpan ID acak sendiri secara lokal (tidak ikut
   pindah akun). Saat ada yang login dari perangkat yang belum dipercaya,
   permintaan disimpan di data akun (shared) lalu pemilik akun yang sedang
   login di perangkat lain akan melihat popup untuk Izinkan/Tolak. Perangkat
   pertama yang berhasil login ke sebuah akun otomatis dipercaya (supaya tidak
   ada yang terkunci saat belum ada perangkat lain yang bisa menyetujui). */
function getDeviceId(){
  const KEY = 'soulyarena:deviceId';
  let id = null;
  try{ id = localStorage.getItem(KEY); }catch(e){}
  if(!id){
    id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem(KEY, id); }catch(e){}
  }
  return id;
}
function deviceLabel(){
  const ua = navigator.userAgent || '';
  let os = 'Perangkat';
  if(/Android/i.test(ua)) os = 'Android';
  else if(/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
  else if(/Windows/i.test(ua)) os = 'Windows';
  else if(/Mac OS/i.test(ua)) os = 'Mac';
  else if(/Linux/i.test(ua)) os = 'Linux';
  let browser = 'Browser';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/OPR\//i.test(ua)) browser = 'Opera';
  else if(/Chrome\//i.test(ua)) browser = 'Chrome';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua)) browser = 'Safari';
  return browser + ' \u2022 ' + os;
}
function fmtTime(ts){
  try{ return new Date(ts).toLocaleString('id-ID', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}); }
  catch(e){ return ''; }
}

let loginWatchTimer = null;
let approvalModalOpen = false;
function startLoginRequestWatcher(){
  stopLoginRequestWatcher();
  checkPendingLoginRequests();
  loginWatchTimer = setInterval(checkPendingLoginRequests, 4000);
}
function stopLoginRequestWatcher(){
  if(loginWatchTimer){ clearInterval(loginWatchTimer); loginWatchTimer = null; }
}
async function checkPendingLoginRequests(){
  if(!CURRENT || approvalModalOpen) return;
  try{
    const fresh = await getUser(CURRENT.username);
    if(!fresh || !Array.isArray(fresh.pendingLogins)) return;
    const myDevId = getDeviceId();
    const pending = fresh.pendingLogins.find(r=> r.status==='pending' && r.deviceId!==myDevId);
    if(pending) showLoginApprovalModal(pending);
  }catch(e){ /* diam-diam gagal, dicoba lagi di siklus berikutnya */ }
}
function showLoginApprovalModal(req){
  if(approvalModalOpen || !CURRENT) return;
  approvalModalOpen = true;
  const wrap = document.createElement('div');
  wrap.id = 'loginApprovalModal';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(5,5,15,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  wrap.innerHTML = `
    <div class="glass card" style="max-width:340px;width:100%;margin:0;text-align:center;">
      <div style="color:var(--gold);margin-bottom:6px;display:flex;justify-content:center;">${icon('key',34)}</div>
      <h3 style="margin:0 0 6px;">Login Baru Terdeteksi</h3>
      <p style="margin:0 0 4px;">Perangkat <b>${escapeHtml(req.label||'Tidak diketahui')}</b> mencoba masuk ke akun kamu (<b>${escapeHtml(CURRENT.username)}</b>).</p>
      <p class="small" style="margin:0 0 16px;">${fmtTime(req.ts)}</p>
      <div style="display:flex;gap:10px;">
        <button class="btn-ghost" id="denyLoginBtn" style="width:auto;flex:1;color:var(--danger);border-color:var(--danger);">Tolak</button>
        <button class="btn-primary" id="allowLoginBtn" style="width:auto;flex:1;">Izinkan</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const closeModal = ()=>{ wrap.remove(); approvalModalOpen = false; };
  document.getElementById('allowLoginBtn').onclick = async ()=>{
    document.getElementById('allowLoginBtn').disabled = true;
    try{
      const u = await getUser(CURRENT.username);
      if(u){
        if(!Array.isArray(u.pendingLogins)) u.pendingLogins = [];
        if(!Array.isArray(u.trustedDevices)) u.trustedDevices = [];
        const idx = u.pendingLogins.findIndex(r=>r.id===req.id);
        if(idx>=0) u.pendingLogins[idx].status = 'approved';
        if(!u.trustedDevices.some(d=>d.id===req.deviceId)){
          u.trustedDevices.push({id:req.deviceId, label:req.label, addedAt:Date.now()});
        }
        u.pendingLogins = u.pendingLogins.filter(r=> r.status==='pending' || (Date.now()-r.ts) < 5*60*1000);
        await saveUser(u);
        if(CURRENT && u.username===CURRENT.username) CURRENT = u;
        showToast('Perangkat diizinkan masuk','ok');
      }
    }catch(e){ showToast('Gagal menyimpan persetujuan','err'); }
    closeModal();
  };
  document.getElementById('denyLoginBtn').onclick = async ()=>{
    document.getElementById('denyLoginBtn').disabled = true;
    try{
      const u = await getUser(CURRENT.username);
      if(u && Array.isArray(u.pendingLogins)){
        const idx = u.pendingLogins.findIndex(r=>r.id===req.id);
        if(idx>=0) u.pendingLogins[idx].status = 'denied';
        u.pendingLogins = u.pendingLogins.filter(r=> r.status==='pending' || (Date.now()-r.ts) < 5*60*1000);
        await saveUser(u);
      }
      showToast('Login perangkat lain ditolak','ok');
    }catch(e){ showToast('Gagal menyimpan penolakan','err'); }
    closeModal();
  };
}
function pollMyLoginRequest(username, requestId, handlers){
  const startedAt = Date.now();
  const TIMEOUT_MS = 120000;
  const timer = setInterval(async ()=>{
    if(Date.now()-startedAt > TIMEOUT_MS){
      clearInterval(timer);
      handlers.onTimeout && handlers.onTimeout();
      return;
    }
    try{
      const u = await getUser(username);
      const req = (u && Array.isArray(u.pendingLogins)) ? u.pendingLogins.find(r=>r.id===requestId) : null;
      if(req && req.status==='approved'){
        clearInterval(timer);
        handlers.onApproved && handlers.onApproved(u);
      } else if(req && req.status==='denied'){
        clearInterval(timer);
        handlers.onDenied && handlers.onDenied();
      } else if(!req){
        clearInterval(timer);
        handlers.onDenied && handlers.onDenied();
      }
    }catch(e){ /* coba lagi di siklus berikutnya */ }
  }, 3000);
  return timer;
}
function renderWaitingApproval(username, requestId, onApproved, onDenied){
  const card = document.getElementById('authCard');
  if(!card) return;
  card.innerHTML = `
    <div style="text-align:center;padding:6px 0;">
      <span class="spinner" style="width:26px;height:26px;margin-bottom:14px;display:inline-block;"></span>
      <h3 style="margin:0 0 8px;">Menunggu Persetujuan</h3>
      <p class="small" style="margin:0 0 18px;">Buka Souly Arena di perangkat yang sudah login ke akun ini, lalu izinkan login untuk melanjutkan.</p>
      <button class="btn-ghost" id="cancelWaitBtn" style="width:100%;">Batal</button>
    </div>`;
  let done = false;
  const timer = pollMyLoginRequest(username, requestId, {
    onApproved: (u)=>{ if(done) return; done = true; showToast('Login disetujui!','ok'); onApproved(u); },
    onDenied: ()=>{ if(done) return; done = true; showToast('Login ditolak oleh pemilik akun.','err'); onDenied(); },
    onTimeout: ()=>{ if(done) return; done = true; showToast('Permintaan login kedaluwarsa.','err'); onDenied(); }
  });
  document.getElementById('cancelWaitBtn').onclick = async ()=>{
    if(done) return; done = true;
    clearInterval(timer);
    try{
      const u = await getUser(username);
      if(u && Array.isArray(u.pendingLogins)){
        const idx = u.pendingLogins.findIndex(r=>r.id===requestId);
        if(idx>=0) u.pendingLogins[idx].status = 'denied';
        await saveUser(u);
      }
    }catch(e){}
    onDenied();
  };
}

async function getUser(username){
  const raw = await storeGet('users:'+username, true);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
async function saveUser(u){
  return await storeSet('users:'+u.username, JSON.stringify(u), true);
}
async function ensureAdmin(){
  let admin = await getUser('souly');
  if(!admin){ admin = newUser('souly','souly123'); }
  // Akun admin utama selalu koin & lampu Idea unlimited, dan level 99 (MAX).
  admin.level = MAX_LEVEL;
  admin.xp = 0;
  if(!Array.isArray(admin.trustedDevices)) admin.trustedDevices = [];
  if(!Array.isArray(admin.pendingLogins)) admin.pendingLogins = [];
  await saveUser(admin);
}

/* Baca file gambar dari galeri, lalu perkecil ukurannya sebelum disimpan */
function fileToResizedDataUrl(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Gagal membaca file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('File bukan gambar yang valid'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const XP_BASE = 100, XP_STEP = 22, MAX_LEVEL = 99;

function xpNeeded(level){ return XP_BASE + (level-1)*XP_STEP; }

function showToast(text, kind){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.style.background = kind==='err' ? 'rgba(251,113,133,0.92)' : kind==='gold' ? 'rgba(251,191,36,0.95)' : 'rgba(52,211,153,0.92)';
  t.style.color = '#0f172a';
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

let CURRENT = null; // sesi pengguna aktif di memori (tidak ikut ter-reset localStorage/window.storage milik akun)

async function addRewards(coins, xp){
  CURRENT.coins += coins;
  CURRENT.xp += xp;
  let leveledUp = false;
  while(CURRENT.level < MAX_LEVEL && CURRENT.xp >= xpNeeded(CURRENT.level)){
    CURRENT.xp -= xpNeeded(CURRENT.level);
    CURRENT.level++;
    leveledUp = true;
  }
  if(CURRENT.level >= MAX_LEVEL){ CURRENT.xp = Math.min(CURRENT.xp, xpNeeded(MAX_LEVEL)-1); }
  await saveUser(CURRENT);
  return leveledUp;
}

/* ===================== PILL SELECTOR MELUNCUR (animasi liquid glass) ===================== */
function movePill(containerEl, pillEl, activeSelector){
  if(!containerEl || !pillEl) return;
  const active = containerEl.querySelector(activeSelector);
  if(!active) return;
  const cRect = containerEl.getBoundingClientRect();
  const aRect = active.getBoundingClientRect();
  pillEl.style.width = aRect.width + 'px';
  pillEl.style.transform = 'translateX(' + (aRect.left - cRect.left) + 'px)';
}
let navResizeBound = false;
function ensureNavResizeListener(){
  if(navResizeBound) return;
  navResizeBound = true;
  window.addEventListener('resize', ()=>{
    requestAnimationFrame(()=>{
      movePill(document.getElementById('bottomnav'), document.getElementById('navPill'), '.navbtn.active');
    });
  });
}

function pickQuizQuestionFromBank(){
  const used = CURRENT.usedQuizIds || [];
  const targetD = (CURRENT.quizDifficulty||0) + 1; // 0..3 -> 1..4
  let pool = QUIZ_BANK.filter(q => !used.includes(q.id) && q.d === targetD);
  if(pool.length === 0) pool = QUIZ_BANK.filter(q => !used.includes(q.id));
  if(pool.length === 0){
    CURRENT.usedQuizIds = [];
    pool = QUIZ_BANK.filter(q => q.d === targetD);
    if(pool.length === 0) pool = QUIZ_BANK.slice();
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

/* Soal quiz tak terbatas: dibuat oleh AI di server, jadi tiap pengguna bisa
   dapat soal baru terus-menerus dan tidak akan mengulang soal yang sudah
   pernah dijawab (dicek lewat riwayat teks soal per akun). Bank soal statis
   di atas cuma dipakai sebagai cadangan kalau koneksi ke AI gagal. */
async function fetchAiQuizQuestion(difficulty){
  const avoid = (CURRENT.usedQuizTexts || []).slice(-25);
  const res = await fetch('/api/quiz', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ difficulty: difficulty + 1, avoid })
  });
  if(!res.ok){
    let msg = 'Gagal memuat soal AI';
    try{ const d = await res.json(); if(d && d.error) msg = d.error; }catch(_){}
    throw new Error(msg);
  }
  const data = await res.json();
  return {
    id: 'ai-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
    d: difficulty + 1, q: data.question, o: data.options, a: data.answerIndex,
    source: 'ai'
  };
}

async function pickQuizQuestion(){
  const diff = CURRENT.quizDifficulty || 0;
  CURRENT.usedQuizTexts = CURRENT.usedQuizTexts || [];
  for(let attempt=0; attempt<2; attempt++){
    try{
      const q = await fetchAiQuizQuestion(diff);
      const norm = q.q.trim().toLowerCase();
      if(!CURRENT.usedQuizTexts.includes(norm)) return q;
    }catch(e){
      break;
    }
  }
  return pickQuizQuestionFromBank();
}

/* ===================== TIC TAC TOE AI ===================== */
function tttWinner(b){
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const [a,b1,c] of lines){ if(b[a] && b[a]===b[b1] && b[a]===b[c]) return b[a]; }
  if(b.every(x=>x)) return 'draw';
  return null;
}
function minimax(b, isAI, depth){
  const w = tttWinner(b);
  if(w==='O') return {score: 10-depth};
  if(w==='X') return {score: depth-10};
  if(w==='draw') return {score:0};
  const moves = [];
  for(let i=0;i<9;i++){
    if(!b[i]){
      const nb = b.slice(); nb[i] = isAI ? 'O' : 'X';
      const res = minimax(nb, !isAI, depth+1);
      moves.push({idx:i, score:res.score});
    }
  }
  if(isAI){
    return moves.reduce((best,m)=> m.score>best.score?m:best, {score:-Infinity, idx:moves[0].idx});
  } else {
    return moves.reduce((best,m)=> m.score<best.score?m:best, {score:Infinity, idx:moves[0].idx});
  }
}
const TTT_RANDOM_BY_DIFF = [0.6, 0.35, 0.15, 0]; // Mudah..Ahli: makin kecil, makin jarang AI asal-asalan
function aiMove(board, difficulty){
  const empty = board.map((v,i)=>v?null:i).filter(v=>v!==null);
  const randomChance = TTT_RANDOM_BY_DIFF[difficulty] ?? 0.3;
  if(Math.random() < randomChance){
    return empty[Math.floor(Math.random()*empty.length)];
  }
  const best = minimax(board.slice(), true, 0);
  return best.idx;
}

/* ===================== AI CHAT (lewat backend sendiri, tanpa API key di sisi pengguna) ===================== */
async function callAI(userText, history){
  const messages = [
    ...history.map(h => ({role:h.role, content:h.content})),
    {role:'user', content:userText}
  ];
  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages })
  });
  if(!res.ok){
    let detail = 'HTTP ' + res.status;
    try{ const errData = await res.json(); if(errData && errData.error) detail = errData.error; }catch(e){}
    throw new Error(detail);
  }
  const data = await res.json();
  const text = data.reply || '';
  return (text || '(tidak ada respons)').trim();
}

function renderAuth(){
  appEl.innerHTML = `

        <input id="u" placeholder="Username" autocomplete="username">
        <div class="pwd-wrap">
          <input id="p" type="password" placeholder="Password" autocomplete="current-password">
          <button type="button" class="pwd-toggle" id="pwdToggle">${icon('eye',18)}</button>
        </div>
        <div class="err" id="authErr"></div>
        <button class="btn-primary" id="authBtn">Masuk</button>
        <div class="link" id="switchLink">Belum punya akun? Daftar</div>
      </div>
      <p id="storageNote" class="keyhint" style="text-align:center;margin-top:14px;"></p>
    </div>
  </div>`;
  if(!storageOK){
    document.getElementById('storageNote').textContent = 'Catatan: penyimpanan permanen tidak terdeteksi saat ini, jadi akun hanya tersimpan selama sesi ini berlangsung.';
  }
  let mode = 'login';
  document.getElementById('themeBtn').onclick = toggleTheme;
  const pwdInput = document.getElementById('p');
  const pwdToggle = document.getElementById('pwdToggle');
  pwdToggle.onclick = ()=>{
    const show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    pwdToggle.innerHTML = icon(show ? 'eyeoff' : 'eye', 18);
  };
  const title = document.getElementById('authTitle');
  const btn = document.getElementById('authBtn');
  const switchLink = document.getElementById('switchLink');
  const err = document.getElementById('authErr');

  switchLink.onclick = ()=>{
    mode = mode==='login' ? 'register' : 'login';
    title.textContent = mode==='login' ? 'Masuk' : 'Daftar Akun';
    btn.textContent = mode==='login' ? 'Masuk' : 'Daftar';
    switchLink.textContent = mode==='login' ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk';
    err.textContent = '';
  };

  btn.onclick = async ()=>{
    const username = document.getElementById('u').value.trim().toLowerCase();
    const password = document.getElementById('p').value.trim();
    err.textContent = '';
    if(!username || !password){ err.textContent = 'Isi username dan password.'; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try{
      if(mode === 'register'){
        const exist = await getUser(username);
        if(exist){ err.textContent = 'Username sudah dipakai.'; btn.disabled=false; btn.textContent='Daftar'; return; }
        const u = newUser(username, password);
        u.trustedDevices = [{id:getDeviceId(), label:deviceLabel(), addedAt:Date.now()}];
        const ok = await saveUser(u);
        if(!ok){ err.textContent = 'Gagal menyimpan akun, coba lagi.'; btn.disabled=false; btn.textContent='Daftar'; return; }
        CURRENT = u;
        VIEW = 'home';
        startLoginRequestWatcher();
        showToast('Akun berhasil dibuat!','ok');
        render();
      } else {
        const u = await getUser(username);
        if(!u){ err.textContent = 'Akun tidak ditemukan. Cek username, atau daftar dulu.'; btn.disabled=false; btn.textContent='Masuk'; return; }
        if(u.password !== password){ err.textContent = 'Password salah.'; btn.disabled=false; btn.textContent='Masuk'; return; }
        if(u.tttDifficulty === undefined) u.tttDifficulty = 0;
        if(u.quizDifficulty === undefined) u.quizDifficulty = 0;
        if(u.avatarColor === undefined) u.avatarColor = AVATAR_COLORS[0];
        if(!Array.isArray(u.trustedDevices)) u.trustedDevices = [];
        if(!Array.isArray(u.pendingLogins)) u.pendingLogins = [];

        const finishLogin = (userObj)=>{
          CURRENT = userObj;
          VIEW = 'home';
          resetAiDailyIfNeeded();
          startLoginRequestWatcher();
          showToast('Selamat datang, '+userObj.username+'!','ok');
          render();
        };

        const devId = getDeviceId();
        const isTrusted = u.trustedDevices.some(d=>d.id===devId);

        if(isTrusted || u.trustedDevices.length === 0){
          // Perangkat sudah dipercaya sebelumnya, atau ini perangkat pertama
          // yang login ke akun ini (belum ada satu pun perangkat terdaftar)
          // sehingga otomatis dipercaya tanpa perlu approval.
          if(!isTrusted) u.trustedDevices.push({id:devId, label:deviceLabel(), addedAt:Date.now()});
          await saveUser(u);
          finishLogin(u);
          return;
        }

        // Perangkat belum dikenal -> kirim permintaan izin ke pemilik akun
        // yang sedang login di perangkat lain, lalu tampilkan layar menunggu.
        const requestId = 'req_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
        u.pendingLogins.push({id:requestId, deviceId:devId, label:deviceLabel(), ts:Date.now(), status:'pending'});
        const savedReq = await saveUser(u);
        if(!savedReq){ err.textContent = 'Gagal mengirim permintaan login, coba lagi.'; btn.disabled=false; btn.textContent='Masuk'; return; }
        renderWaitingApproval(username, requestId, finishLogin, renderAuth);
      }
    }catch(e){
      console.error(e);
      err.textContent = 'Terjadi kesalahan: ' + (e && e.message ? e.message : 'tidak diketahui');
      btn.disabled=false; btn.textContent = mode==='login'?'Masuk':'Daftar';
    }
  };
}

function resetAiDailyIfNeeded(){
  if(CURRENT.aiUsesDate !== todayStr()){
    CURRENT.aiUsesDate = todayStr();
    CURRENT.aiUsesToday = 0;
    saveUser(CURRENT);
  }
}

function wireDiffBar(containerId, pillId, onPick){
  const bar = document.getElementById(containerId);

  bar.querySelectorAll('.pillbar-btn').forEach(btn=>{
    btn.onclick = ()=>{

/* ---------- TIC TAC TOE ---------- */
let tttBoard, tttTurn, tttOver;
function newTttGame(){
  tttBoard = Array(9).fill(null);
  tttTurn = 'X'; tttOver = false;
}
function renderTTT(c){
  if(!tttBoard) newTttGame();
  c.innerHTML = `
    <div class="glass card">
      <div class="row"><h3>Tic-Tac-Toe</h3><span class="small">Level ${CURRENT.tttLevel}</span></div>
      <p>Kamu (X) vs AI (O). Menang = XP + koin. Makin sulit mode, makin besar hadiahnya.</p>
      <div class="small">Mode tantangan</div>
      ${renderDiffBar('tttDiffBar','tttDiffPill', CURRENT.tttDifficulty||0)}
      <div class="board" id="board"></div>
      <div id="tttStatus" class="row"><span class="small" id="tttMsg">Giliranmu</span><button class="btn-small btn-ghost" id="resetTtt">Main Lagi</button></div>
    </div>
  `;
  wireDiffBar('tttDiffBar','tttDiffPill', async (i)=>{
    if(CURRENT.tttDifficulty === i) return;
    CURRENT.tttDifficulty = i;
    await saveUser(CURRENT);
    newTttGame();
    drawBoard();
    document.getElementById('tttMsg').textContent = 'Giliranmu';
  });
  drawBoard();
  document.getElementById('resetTtt').onclick = ()=>{ newTttGame(); drawBoard(); };
}
function drawBoard(){
  const b = document.getElementById('board');
  if(!b) return;
  b.innerHTML = tttBoard.map((v,i)=>`<div class="cell ${v==='X'?'x':v==='O'?'o':''}" data-i="${i}">${v||''}</div>`).join('');
  b.querySelectorAll('.cell').forEach(cell=>{
    cell.onclick = ()=> onCellClick(parseInt(cell.dataset.i));
  });
}
async function onCellClick(i){
  if(tttOver || tttBoard[i] || tttTurn!=='X') return;
  tttBoard[i] = 'X';
  drawBoard();
  let w = tttWinner(tttBoard);
  if(w){ return finishTtt(w); }
  tttTurn = 'O';
  document.getElementById('tttMsg').textContent = 'AI berpikir...';
  setTimeout(async ()=>{
    const move = aiMove(tttBoard, CURRENT.tttDifficulty||0);
    tttBoard[move] = 'O';
    drawBoard();
    w = tttWinner(tttBoard);
    if(w){ return finishTtt(w); }
    tttTurn = 'X';
    document.getElementById('tttMsg').textContent = 'Giliranmu';
  }, 450);
}
async function finishTtt(w){
  tttOver = true;
  const msgEl = document.getElementById('tttMsg');
  const diff = CURRENT.tttDifficulty || 0;
  if(w==='X'){
    const xpGain = 15 + CURRENT.tttLevel*3 + diff*8;
    const coinGain = 10 + CURRENT.tttLevel*2 + diff*5;
    CURRENT.tttWins++;
    if(CURRENT.tttWins % 3 === 0) CURRENT.tttLevel = Math.min(CURRENT.tttLevel+1, 50);
    const leveled = await addRewards(coinGain, xpGain);
    msgEl.textContent = `Menang! +${xpGain} XP, +${coinGain} koin`;
    showToast(`Menang! +${xpGain} XP, +${coinGain} koin`, 'ok');
    if(leveled) showToast(`Naik ke Level ${CURRENT.level}!`, 'gold');
    refreshTopbar();
  } else if(w==='O'){
    msgEl.textContent = 'AI menang. Coba lagi!';
    await saveUser(CURRENT);
  } else {
    msgEl.textContent = 'Seri!';
    await addRewards(2, 5);
    refreshTopbar();
  }
}

    CURRENT.quizDifficulty = i;
    await saveUser(CURRENT);
    renderQuiz(document.getElementById('content'));
  });
  const q = await pickQuizQuestion();
  if(myToken !== quizRenderToken) return; // pengguna sudah pindah / ganti kesulitan, buang hasil ini
  quizQ = q;
  const body = document.getElementById('quizBody');
  if(!body) return;
  body.style.cssText = 'width:100%;';
  body.innerHTML = `
    <p style="font-size:16px;color:var(--text);font-weight:600;margin:0;width:100%;">${escapeHtml(quizQ.q)}</p>
    <div id="opts" style="width:100%;"></div>
    <div class="row" style="width:100%;">
      <span class="small" id="aiHintInfo">${quizAiHintLabel()}</span>
      <button class="btn-small btn-ghost" id="askAiQuiz">${icon('ai',14)} Tanya AI</button>
    </div>
    <div id="quizAiHint" style="width:100%;"></div>
  `;
  const opts = document.getElementById('opts');
  quizQ.o.forEach((optText, idx)=>{
    const b = document.createElement('button');
    b.className = 'qopt';
    b.textContent = optText;
    b.onclick = ()=> answerQuiz(idx, b, opts);
    opts.appendChild(b);
  });
  const askBtn = document.getElementById('askAiQuiz');
  askBtn.onclick = ()=> askAiForQuiz(quizQ, document.getElementById('quizAiHint'), askBtn);
}
function quizAiHintLabel(){
  const remaining = aiRemaining();
  if(remaining > 0) return icon('bulb',14) + ' ' + remaining + ' AI gratis hari ini';
  if(CURRENT.bulbs > 0) return icon('bulb',14) + ' ' + CURRENT.bulbs + ' lampu Idea';
  return icon('bulb',14) + ' Limit AI habis';
}
async function askAiForQuiz(q, box, btn){
  resetAiDailyIfNeeded();
  const remaining = aiRemaining();
  if(remaining <= 0 && CURRENT.bulbs <= 0){
    showToast('Limit AI habis. Beli lampu Idea di Shop!', 'err');
    return;
  }
  if(btn) btn.disabled = true;
  box.innerHTML = `<div class="bubble ai" style="margin-top:8px;"><span class="spinner"></span></div>`;
  if(!isAdminUser(CURRENT)){ if(remaining > 0){ CURRENT.aiUsesToday++; } else { CURRENT.bulbs--; } }
  await saveUser(CURRENT);
  refreshTopbar();
  const info = document.getElementById('aiHintInfo');
  if(info) info.innerHTML = quizAiHintLabel();
  try{
    const prompt = 'Bantu aku menjawab soal quiz pilihan ganda berikut. Sebutkan jawaban yang paling tepat lalu jelaskan alasannya singkat (maks 2-3 kalimat).\nSoal: ' + q.q + '\nPilihan: ' + q.o.map((o,i)=> String.fromCharCode(65+i)+'. '+o).join(', ');
    const reply = await callAI(prompt, []);
    box.innerHTML = `<div class="bubble ai" style="margin-top:8px;">${formatMessage(reply)}</div>`;
  }catch(e){
    box.innerHTML = `<div class="bubble ai" style="margin-top:8px;">Gagal minta bantuan AI: ${escapeHtml(e && e.message ? e.message : 'tidak diketahui')}</div>`;
    if(btn) btn.disabled = false;
  }
}
async function answerQuiz(idx, btn, opts){
  if(quizAnswered) return;
  quizAnswered = true;
  CURRENT.usedQuizIds = CURRENT.usedQuizIds || [];
  CURRENT.usedQuizTexts = CURRENT.usedQuizTexts || [];
  if(quizQ.source === 'ai'){
    const norm = quizQ.q.trim().toLowerCase();
    if(!CURRENT.usedQuizTexts.includes(norm)) CURRENT.usedQuizTexts.push(norm);
    if(CURRENT.usedQuizTexts.length > 300) CURRENT.usedQuizTexts = CURRENT.usedQuizTexts.slice(-300);
  } else {
    CURRENT.usedQuizIds.push(quizQ.id);
  }
  const correct = idx === quizQ.a;
  const diff = CURRENT.quizDifficulty || 0;
  Array.from(opts.children).forEach((el,i)=>{
    if(i===quizQ.a) el.classList.add('correct');
    else if(i===idx) el.classList.add('wrong');
    el.disabled = true;
  });
  if(correct){
    quizStreak++;
    const xpGain = 8 + quizQ.d*4 + CURRENT.quizLevel + diff*3;
    const coinGain = 4 + quizQ.d*2 + diff*2;
    CURRENT.quizWins++;
    if(CURRENT.quizWins % 5 === 0) CURRENT.quizLevel = Math.min(CURRENT.quizLevel+1, 50);
    const leveled = await addRewards(coinGain, xpGain);
    showToast(`Benar! +${xpGain} XP, +${coinGain} koin`, 'ok');
    if(leveled) showToast(`Naik ke Level ${CURRENT.level}!`, 'gold');
  } else {
    quizStreak = 0;
    await saveUser(CURRENT);
    showToast('Kurang tepat, coba lagi ya', 'err');
  }
  refreshTopbar();
  setTimeout(()=>{ if(VIEW==='quiz') renderContent(); }, 1100);
}

/* ---------- AI CHAT ---------- */
function aiRemaining(){
  resetAiDailyIfNeeded();
  return Math.max(0, aiDailyLimit(CURRENT) - CURRENT.aiUsesToday);
}
function renderAI(c){
  resetAiDailyIfNeeded();
  const remaining = Math.max(0, aiDailyLimit(CURRENT) - CURRENT.aiUsesToday);
  c.innerHTML = `
    <div class="glass card">
      <div class="row"><h3>Chat AI</h3><span class="small">${remaining} pesan gratis hari ini</span></div>
      <div class="chatlog" id="chatlog"></div>
      <div class="chatrow">
        <input id="chatInput" placeholder="Tulis pesan..." />
        <button class="btn-primary" style="width:auto;" id="sendBtn">${icon('send',16)}</button>
      </div>
      <p style="margin-top:8px;">Kehabisan limit? Beli lampu Idea di Shop untuk pesan tambahan.</p>
    </div>
  `;
  const log = document.getElementById('chatlog');
  log.innerHTML = chatHistory.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${m.role==='user'?escapeHtml(m.content):formatMessage(m.content)}</div>`).join('');
  log.scrollTop = log.scrollHeight;
  const input = document.getElementById('chatInput');
  const send = document.getElementById('sendBtn');
  send.onclick = ()=> sendChat(input, log);
  input.onkeydown = (e)=>{ if(e.key==='Enter') sendChat(input, log); };
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* Render balasan AI: escape dulu supaya aman dari HTML, lalu ubah LaTeX (\[..\], \(..\), $$..$$, $..$)
   jadi rumus rapi lewat KaTeX, dan markdown ringan (**tebal**, list "- ") jadi HTML. */
function renderMathSafe(tex, display){
  try{
    if(window.katex){
      return katex.renderToString(tex.trim(), { throwOnError:false, displayMode: !!display });
    }
  }catch(e){}
  return escapeHtml(display ? ('\\[' + tex + '\\]') : ('\\(' + tex + '\\)'));
}
function formatMessage(raw){
  if(!raw) return '';
  const store = [];
  const stash = (html)=>{ store.push(html); return '\u0000M' + (store.length-1) + '\u0000'; };

  let text = String(raw);
  // Rumus mode "display": $$..$$ dan \[..\]
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex)=> stash(renderMathSafe(tex, true)));
  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (m, tex)=> stash(renderMathSafe(tex, true)));
  // Rumus mode "inline": \(..\) dan $..$
  text = text.replace(/\\\(([\s\S]+?)\\\)/g, (m, tex)=> stash(renderMathSafe(tex, false)));
  text = text.replace(/(^|[^$])\$([^$\n]+?)\$(?!\$)/g, (m, pre, tex)=> pre + stash(renderMathSafe(tex, false)));

  // Sisanya di-escape supaya aman
  text = escapeHtml(text);

  // Markdown ringan
  text = text.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  text = text.replace(/(?:^|\n)- (.+)/g, '\n<li>$1</li>');
  text = text.replace(/(<li>[\s\S]*<\/li>)/, '<ul>$1</ul>');
  text = text.replace(/\n/g, '<br>');

  // Kembalikan rumus yang sudah dirender
  text = text.replace(/\u0000M(\d+)\u0000/g, (m, i)=> store[Number(i)]);
  return text;
}
async function sendChat(input, log){
  const text = input.value.trim();
  if(!text) return;
  resetAiDailyIfNeeded();
  const remaining = Math.max(0, aiDailyLimit(CURRENT) - CURRENT.aiUsesToday);
  if(remaining <= 0 && CURRENT.bulbs <= 0){
    showToast('Limit AI habis. Beli lampu Idea di Shop!', 'err');
    return;
  }
  input.value='';
  chatHistory.push({role:'user', content:text});
  log.innerHTML += `<div class="bubble me">${escapeHtml(text)}</div>`;
  log.scrollTop = log.scrollHeight;
  const typingEl = document.createElement('div');
  typingEl.className = 'bubble ai';
  typingEl.innerHTML = '<span class="spinner"></span>';
  log.appendChild(typingEl);
  log.scrollTop = log.scrollHeight;

  if(!isAdminUser(CURRENT)){
    if(remaining > 0){ CURRENT.aiUsesToday++; }
    else { CURRENT.bulbs--; }
  }
  await saveUser(CURRENT);
  refreshTopbar();
  if(VIEW==='ai'){
    const remainEl = document.querySelector('#content .small');
    if(remainEl) remainEl.textContent = `${Math.max(0,aiDailyLimit(CURRENT)-CURRENT.aiUsesToday)} pesan gratis hari ini`;
  }

  try{
    const reply = await callAI(text, chatHistory.slice(0,-1));
    chatHistory.push({role:'assistant', content:reply});
    typingEl.innerHTML = formatMessage(reply);
  }catch(e){
    typingEl.textContent = 'Maaf, terjadi kendala menghubungi AI: ' + (e && e.message ? e.message : 'tidak diketahui');
  }
  log.scrollTop = log.scrollHeight;
}

/* ---------- SHOP ---------- */
function renderShop(c){
  c.innerHTML = `
    <div class="glass card">
      <h3>Shop</h3>
      <p>Gunakan koin hasil menang game untuk membeli item.</p>
    </div>
    <div class="glass shopitem">
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="color:var(--accent);">${icon('bulb',28)}</div>
        <div>
          <div style="font-weight:700;">Idea Bulb</div>
          <div class="small">+1 pesan AI ekstra</div>
        </div>
      </div>
      <button class="btn-primary" style="width:auto;" id="buyBulb">${icon('coin',14)} ${BULB_COST}</button>
    </div>
    <div class="glass card">
      <div class="row"><span>Koin kamu</span><b>${dispNum(CURRENT,CURRENT.coins)}</b></div>
      <div class="row"><span>Lampu dimiliki</span><b>${dispNum(CURRENT,CURRENT.bulbs)}</b></div>
    </div>
  `;
  document.getElementById('buyBulb').onclick = async ()=>{
    if(!isAdminUser(CURRENT)){
      if(CURRENT.coins < BULB_COST){ showToast('Koin tidak cukup!', 'err'); return; }
      CURRENT.coins -= BULB_COST;
    }
    CURRENT.bulbs += 1;
    await saveUser(CURRENT);
    showToast('Berhasil membeli 1 lampu Idea', 'gold');
    refreshTopbar();
    renderShop(document.getElementById('content'));
  };
}

function refreshTopbar(){
  if(!CURRENT) return;
  const coinVal = document.getElementById('coinVal');
  const bulbVal = document.getElementById('bulbVal');
  if(coinVal){ coinVal.textContent = dispNum(CURRENT,CURRENT.coins); bumpPill('coinPill'); }
  if(bulbVal){ bulbVal.textContent = dispNum(CURRENT,CURRENT.bulbs); bumpPill('bulbPill'); }
  const topLvl = document.querySelector('.topbar .small');
  if(topLvl) topLvl.textContent = `Level ${CURRENT.level}`;
}
function bumpPill(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

boot();
</script>
